name: Release

# Manual trigger only: landing code on main must not publish. Run it with
#   gh workflow run release.yml --ref main
# or the "Run workflow" button on the Actions tab. This keeps a window where
# main is up to date but nothing is on the registry yet — npm can only be
# unpublished within 72h, so the merge and the publish stay separate acts.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN;
          # NPM_TOKEN alone is only read by changesets/action's own .npmrc, which
          # NPM_CONFIG_USERCONFIG then shadows.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
